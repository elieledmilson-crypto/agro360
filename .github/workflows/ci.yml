name: Agro360 CI

on:
  push:
    branches:
      - main
      - infra/supabase
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Block browser data storage
        run: |
          if grep -R -n -E 'localStorage|sessionStorage|indexedDB' src; then
            echo 'Persistência local direta não é permitida no Agro360.'
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
